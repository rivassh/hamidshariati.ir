# Standalone dev server — mirrors production MIME rules for /games/unity-game/
server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_types application/wasm application/javascript application/json application/octet-stream text/css text/html;

    location ~ \.wasm$ {
        default_type application/wasm;
        add_header Cross-Origin-Opener-Policy same-origin always;
        add_header Cross-Origin-Embedder-Policy require-corp always;
        add_header Cross-Origin-Resource-Policy same-origin always;
    }

    location ~ \.data$ {
        default_type application/octet-stream;
        add_header Accept-Ranges bytes always;
    }

    location ~ \.symbols\.json$ {
        default_type application/json;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
