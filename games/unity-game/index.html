<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>بازی مار — مار نئون</title>
  <link rel="stylesheet" href="/game-platform/style.css" />
</head>
<body>
  <header>
    <h1>بازی مار — مار نئون</h1>
    <p>فلش‌ها یا کلیک جهت‌دار · امتیاز · Game Over · Restart</p>
  </header>

  <div id="api-status">
    <span id="api-dot"></span>
    <span id="api-label">بررسی...</span>
  </div>

  <div id="game-container"></div>

  <div id="touch-controls">
    <div class="dpad">
      <button class="dpad-btn up" data-dir="up" aria-label="بالا">&#9650;</button>
      <button class="dpad-btn left" data-dir="left" aria-label="چپ">&#9664;</button>
      <button class="dpad-btn center"></button>
      <button class="dpad-btn right" data-dir="right" aria-label="راست">&#9654;</button>
      <button class="dpad-btn down" data-dir="down" aria-label="پایین">&#9660;</button>
    </div>
  </div>

  <footer>Phaser.js — مار نئون</footer>

  <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
  <script src="/game-platform/game.js"></script>
  <script>
    (function () {
      const dot = document.getElementById('api-dot');
      const label = document.getElementById('api-label');
      if (!dot || !label) return;

      function checkStatus() {
        fetch('/game-platform/api-status.php?health=1')
          .then(function (r) { return r.json(); })
          .then(function (data) {
            var ok = data.status === 'ok';
            dot.className = ok ? 'dot-ok' : 'dot-warn';
            label.textContent = ok
              ? 'API: ' + data.game + ' v' + data.version
              : 'API: مشکل';
          })
          .catch(function () {
            dot.className = 'dot-err';
            label.textContent = 'API: قطع';
          });
      }

      checkStatus();
      setInterval(checkStatus, 30000);
    })();
  </script>
</body>
</html>
