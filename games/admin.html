<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پنل مدیریت چت‌بات | hamidshariati.ir</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #0f0f23; color: #e2e8f0; padding: 20px; }
        h1 { color: #22d3ee; margin-bottom: 20px; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 10px; }
        .btn { background: #22d3ee; color: #0f0f23; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-weight: bold; font-family: inherit; }
        .btn:hover { background: #0ea5e9; }
        .btn-danger { background: #ef4444; color: white; }
        .btn-sm { padding: 6px 12px; font-size: 0.85rem; }
        
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; margin-bottom: 20px; }
        .card { background: #1e293b; border-radius: 12px; padding: 20px; border: 1px solid #334155; }
        .card-title { font-size: 1.1rem; font-weight: 600; color: #94a3b8; margin-bottom: 15px; }
        
        .form-group { margin-bottom: 15px; }
        .form-label { display: block; color: #94a3b8; font-size: 0.85rem; margin-bottom: 5px; }
        .form-input, .form-select { width: 100%; padding: 10px; background: #0f172a; border: 1px solid #334155; border-radius: 8px; color: #e2e8f0; font-size: 0.95rem; font-family: inherit; }
        .form-input:focus, .form-select:focus { outline: none; border-color: #22d3ee; }
        
        .status-badge { display: inline-block; padding: 3px 10px; border-radius: 12px; font-size: 0.75rem; font-weight: bold; }
        .status-ok { background: #166534; color: #4ade80; }
        .status-err { background: #7f1d1d; color: #f87171; }
        .status-warn { background: #854d0e; color: #fbbf24; }
        
        .session-list { list-style: none; }
        .session-item { padding: 10px; background: #0f172a; border-radius: 8px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
        .session-item.active { border: 1px solid #22d3ee; }
        
        .jobs-list { max-height: 400px; overflow-y: auto; }
        .job-item { padding: 12px; background: #0f172a; border-radius: 8px; margin-bottom: 8px; }
        .job-header { display: flex; justify-content: space-between; margin-bottom: 8px; }
        .job-time { color: #64748b; font-size: 0.8rem; }
        .job-msg { color: #e2e8f0; margin-bottom: 5px; }
        .job-resp { color: #94a3b8; font-size: 0.85rem; }
        
        .test-area { margin-top: 15px; }
        .test-input { display: flex; gap: 8px; }
        .test-input input { flex: 1; }
        
        .login-overlay { position: fixed; inset: 0; background: #0f0f23; display: flex; align-items: center; justify-content: center; z-index: 100; }
        .login-box { background: #1e293b; padding: 30px; border-radius: 12px; border: 1px solid #334155; width: 100%; max-width: 400px; }
        .login-box h2 { color: #22d3ee; margin-bottom: 20px; text-align: center; }
        .login-box .btn { width: 100%; margin-top: 10px; }
        .hidden { display: none !important; }
        
        @media (max-width: 480px) {
            .grid { grid-template-columns: 1fr; }
            .header { flex-direction: column; align-items: stretch; }
        }
    </style>
</head>
<body>
    <div class="login-overlay" id="login-overlay">
        <div class="login-box">
            <h2>🔐 ورود به پنل مدیریت</h2>
            <div class="form-group">
                <label class="form-label">توکن امنیتی</label>
                <input type="password" class="form-input" id="token-input" placeholder="توکن رو وارد کنید...">
            </div>
            <button class="btn" onclick="login()">ورود</button>
        </div>
    </div>

    <div class="hidden" id="main-content">
        <div class="header">
            <h1>⚙️ پنل مدیریت چت‌بات</h1>
            <div style="display:flex;gap:10px;">
                <button class="btn btn-sm" onclick="refreshAll()">🔄 بروزرسانی</button>
                <button class="btn btn-sm btn-danger" onclick="logout()">خروج</button>
            </div>
        </div>

        <div class="grid">
            <!-- Session Manager -->
            <div class="card">
                <div class="card-title">🖥️ مدیریت Tmux Session</div>
                <div class="form-group">
                    <label class="form-label">Session فعال:</label>
                    <select class="form-select" id="session-select"></select>
                </div>
                <button class="btn" onclick="changeSession()">تغییر Session</button>
                <div style="margin-top:15px;">
                    <div class="form-label">Sessionهای فعال:</div>
                    <ul class="session-list" id="sessions-list"></ul>
                </div>
            </div>

            <!-- Server Status -->
            <div class="card">
                <div class="card-title">📊 وضعیت سرور</div>
                <div id="server-status">
                    <p>در حال بررسی...</p>
                </div>
                <div class="test-area">
                    <div class="form-label">تست سریع:</div>
                    <div class="test-input">
                        <input type="text" class="form-input" id="test-msg" placeholder="پیام تست...">
                        <button class="btn btn-sm" onclick="sendTest()">ارسال</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Jobs -->
        <div class="card">
            <div class="card-title">📝 آخرین پیام‌ها</div>
            <div class="jobs-list" id="jobs-list">
                <p>هنوز پیامی ثبت نشده</p>
            </div>
        </div>
    </div>

    <script>
        let TOKEN = localStorage.getItem('admin_token') || '';
        const API = window.location.origin + '/games/mimo-api';

        function login() {
            TOKEN = document.getElementById('token-input').value;
            if (!TOKEN) return;
            localStorage.setItem('admin_token', TOKEN);
            verifyToken();
        }

        function logout() {
            TOKEN = '';
            localStorage.removeItem('admin_token');
            document.getElementById('login-overlay').classList.remove('hidden');
            document.getElementById('main-content').classList.add('hidden');
        }

        async function verifyToken() {
            try {
                const res = await fetch(`${API}/admin/config?token=${TOKEN}`);
                if (res.ok) {
                    document.getElementById('login-overlay').classList.add('hidden');
                    document.getElementById('main-content').classList.remove('hidden');
                    refreshAll();
                } else {
                    alert('توکن نادرست است');
                    localStorage.removeItem('admin_token');
                }
            } catch (e) {
                alert('خطا در اتصال');
            }
        }

        async function refreshAll() {
            await Promise.all([loadConfig(), loadSessions(), loadJobs()]);
        }

        async function loadConfig() {
            try {
                const res = await fetch(`${API}/admin/config?token=${TOKEN}`);
                const data = await res.json();
                document.getElementById('server-status').innerHTML = `
                    <p><strong>بات:</strong> ${data.botName}</p>
                    <p><strong>Session فعلی:</strong> <span class="status-badge status-ok">${data.session}:${data.window}</span></p>
                `;
            } catch (e) {}
        }

        async function loadSessions() {
            try {
                const res = await fetch(`${API}/admin/sessions?token=${TOKEN}`);
                const data = await res.json();
                const select = document.getElementById('session-select');
                const list = document.getElementById('sessions-list');
                
                select.innerHTML = data.sessions.map(s => 
                    `<option value="${s.id}" ${s.id === data.current ? 'selected' : ''}>${s.info}</option>`
                ).join('');
                
                list.innerHTML = data.sessions.map(s => `
                    <li class="session-item ${s.id === data.current ? 'active' : ''}">
                        <span>${s.info}</span>
                        ${s.id === data.current ? '<span class="status-badge status-ok">فعلی</span>' : ''}
                    </li>
                `).join('');
            } catch (e) {}
        }

        async function changeSession() {
            const session = document.getElementById('session-select').value;
            try {
                await fetch(`${API}/admin/session?token=${TOKEN}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ session })
                });
                refreshAll();
            } catch (e) {
                alert('خطا در تغییر session');
            }
        }

        async function loadJobs() {
            try {
                const res = await fetch(`${API}/admin/jobs?token=${TOKEN}`);
                const data = await res.json();
                const list = document.getElementById('jobs-list');
                
                if (data.jobs.length === 0) {
                    list.innerHTML = '<p>هنوز پیامی ثبت نشده</p>';
                    return;
                }
                
                const sorted = data.jobs.sort((a, b) => b.created - a.created);
                list.innerHTML = sorted.map(job => `
                    <div class="job-item">
                        <div class="job-header">
                            <span class="job-time">${new Date(job.created).toLocaleString('fa-IR')}</span>
                            <span class="status-badge status-${job.status === 'done' ? 'ok' : job.status === 'error' ? 'err' : 'warn'}">${job.status}</span>
                        </div>
                        <div class="job-msg">📨 ${escapeHtml(job.message)}</div>
                        ${job.response ? `<div class="job-resp">💬 ${escapeHtml(job.response.slice(0, 200))}</div>` : ''}
                        <div style="color:#64748b;font-size:0.75rem;">Session: ${job.session || '?'}</div>
                    </div>
                `).join('');
            } catch (e) {}
        }

        async function sendTest() {
            const msg = document.getElementById('test-msg').value;
            if (!msg) return;
            try {
                await fetch(`${API}/chat`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: msg })
                });
                document.getElementById('test-msg').value = '';
                setTimeout(loadJobs, 2000);
            } catch (e) {
                alert('خطا در ارسال');
            }
        }

        function escapeHtml(t) { const d = document.createElement('div'); d.textContent = t; return d.innerHTML; }

        // Auto check token on load
        if (TOKEN) verifyToken();
        
        // Auto refresh
        setInterval(() => {
            if (!document.getElementById('main-content').classList.contains('hidden')) {
                refreshAll();
            }
        }, 5000);
    </script>
</body>
</html>
