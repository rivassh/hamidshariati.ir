<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بازی کلمات | hamidshariati.ir</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background: linear-gradient(135deg, #0f0a1e 0%, #1a1035 50%, #0f0a1e 100%);
            color: #e2e8f0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        .game-container {
            max-width: 500px;
            width: 100%;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .title {
            font-size: 2.5rem;
            font-weight: bold;
            background: linear-gradient(135deg, #22d3ee, #a855f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 0 30px rgba(34, 211, 238, 0.3);
        }

        .subtitle {
            color: #94a3b8;
            font-size: 1rem;
            margin-top: 8px;
        }

        .score-board {
            display: flex;
            justify-content: space-around;
            background: rgba(30, 41, 59, 0.8);
            border: 1px solid #334155;
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 24px;
        }

        .score-item {
            text-align: center;
        }

        .score-label {
            font-size: 0.85rem;
            color: #94a3b8;
            margin-bottom: 4px;
        }

        .score-value {
            font-size: 1.8rem;
            font-weight: bold;
            color: #facc15;
        }

        .score-value.high { color: #f472b6; }

        .letters-container {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-bottom: 24px;
            flex-wrap: wrap;
        }

        .letter-btn {
            width: 60px;
            height: 60px;
            border-radius: 12px;
            border: 2px solid #475569;
            background: linear-gradient(135deg, #1e293b, #0f172a);
            color: #e2e8f0;
            font-size: 1.8rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .letter-btn:hover {
            border-color: #22d3ee;
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(34, 211, 238, 0.3);
        }

        .letter-btn:active {
            transform: translateY(0);
        }

        .letter-btn.used {
            opacity: 0.3;
            pointer-events: none;
        }

        .word-display {
            min-height: 80px;
            background: rgba(30, 41, 59, 0.6);
            border: 2px dashed #475569;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            letter-spacing: 8px;
            margin-bottom: 16px;
            padding: 16px;
        }

        .word-display.has-word {
            border-color: #22d3ee;
            border-style: solid;
        }

        .controls {
            display: flex;
            gap: 12px;
            margin-bottom: 24px;
        }

        .btn {
            flex: 1;
            padding: 14px 20px;
            border-radius: 12px;
            border: none;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
        }

        .btn-primary {
            background: linear-gradient(135deg, #22d3ee, #0ea5e9);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(34, 211, 238, 0.4);
        }

        .btn-secondary {
            background: #334155;
            color: #cbd5e1;
        }

        .btn-secondary:hover {
            background: #475569;
        }

        .btn-danger {
            background: linear-gradient(135deg, #ef4444, #dc2626);
            color: white;
        }

        .found-words {
            background: rgba(30, 41, 59, 0.6);
            border: 1px solid #334155;
            border-radius: 16px;
            padding: 16px;
        }

        .found-words-title {
            font-size: 1rem;
            color: #94a3b8;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .found-count {
            background: #22d3ee;
            color: #0f172a;
            padding: 2px 10px;
            border-radius: 12px;
            font-size: 0.85rem;
            font-weight: bold;
        }

        .words-list {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .word-tag {
            background: #1e293b;
            border: 1px solid #334155;
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 0.9rem;
            color: #cbd5e1;
        }

        .word-tag.new {
            animation: popIn 0.3s ease;
        }

        @keyframes popIn {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .message {
            text-align: center;
            padding: 12px;
            border-radius: 12px;
            margin-bottom: 16px;
            font-weight: bold;
            animation: fadeIn 0.3s ease;
        }

        .message.success {
            background: rgba(34, 197, 94, 0.2);
            border: 1px solid #22c55e;
            color: #4ade80;
        }

        .message.error {
            background: rgba(239, 68, 68, 0.2);
            border: 1px solid #ef4444;
            color: #f87171;
        }

        .message.info {
            background: rgba(34, 211, 238, 0.2);
            border: 1px solid #22d3ee;
            color: #22d3ee;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .game-over {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(15, 10, 30, 0.95);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
            animation: fadeIn 0.5s ease;
        }

        .game-over-title {
            font-size: 3rem;
            font-weight: bold;
            color: #f87171;
            margin-bottom: 20px;
        }

        .game-over-score {
            font-size: 2rem;
            color: #fef08a;
            margin-bottom: 10px;
        }

        .game-over-words {
            font-size: 1.2rem;
            color: #94a3b8;
            margin-bottom: 30px;
        }

        .hidden { display: none !important; }

        footer {
            margin-top: auto;
            padding-top: 40px;
            text-align: center;
            color: #475569;
            font-size: 0.8rem;
        }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="header">
            <div class="title">بازی کلمات</div>
            <div class="subtitle">با حروف داده شده کلمه بساز</div>
        </div>

        <div class="score-board">
            <div class="score-item">
                <div class="score-label">امتیاز</div>
                <div class="score-value" id="score">0</div>
            </div>
            <div class="score-item">
                <div class="score-label">کلمات</div>
                <div class="score-value" id="word-count">0</div>
            </div>
            <div class="score-item">
                <div class="score-label">بهترین</div>
                <div class="score-value high" id="high-score">0</div>
            </div>
        </div>

        <div id="message-container"></div>

        <div class="letters-container" id="letters-container"></div>

        <div class="word-display" id="word-display">...</div>

        <div class="controls">
            <button class="btn btn-primary" id="submit-btn" onclick="submitWord()">تایید</button>
            <button class="btn btn-secondary" id="clear-btn" onclick="clearWord()">پاک کردن</button>
            <button class="btn btn-danger" id="shuffle-btn" onclick="shuffleLetters()">🔄</button>
        </div>

        <div class="found-words">
            <div class="found-words-title">
                <span>کلمات پیدا شده</span>
                <span class="found-count" id="found-count">0</span>
            </div>
            <div class="words-list" id="words-list"></div>
        </div>
    </div>

    <div class="game-over hidden" id="game-over">
        <div class="game-over-title">بازی تمام شد!</div>
        <div class="game-over-score" id="final-score">امتیاز: 0</div>
        <div class="game-over-words" id="final-words">0 کلمه پیدا شد</div>
        <button class="btn btn-primary" onclick="newGame()">بازی جدید</button>
    </div>

    <footer>hamidshariati.ir &copy; 2026</footer>

    <script>
        // Persian word dictionary (common words)
        const VALID_WORDS = new Set([
            // 2-letter words
            'آب', 'اک', 'ام', 'ان', 'او', 'باد', 'بر', 'بز', 'بت', 'پا',
            'پر', 'پی', 'تک', 'ثا', 'جی', 'چا', 'حا', 'خا', 'خی', 'دز',
            'دی', 'را', 'زا', 'ژا', 'سا', 'شی', 'صا', 'ضا', 'طا', 'ظا',
            'عا', 'غی', 'فا', 'قا', 'کا', 'گا', 'لا', 'ما', 'نا', 'وا',
            'ها', 'یا',
            // 3-letter words
            'آباد', 'ابری', 'آتش', 'آرام', 'آزرده', 'آسمان', 'آفتاب', 'آلود',
            'بابا', 'برادر', 'باغ', 'بالا', 'بازی', 'بچه', 'بزرگ', 'بهار',
            'پدر', 'پری', 'پسر', 'پنج', 'تازه', 'تخت', 'تکی', 'جادو', 'جوان',
            'چمن', 'چشم', 'حاصل', 'خاک', 'خانه', 'خوب', 'خورشید', 'داشتن',
            'درخت', 'دریا', 'دست', 'دیدن', 'دانه', 'راست', 'زیبا', 'ساعت',
            'سبز', 'ستاره', 'ساعت', 'سنگ', 'سیب', 'شاد', 'شبنم', 'شیرین',
            'صدا', 'ضلع', 'طوفان', 'ظاهر', 'عربی', 'غذا', 'قانون', 'کتاب',
            'کودک', 'گل', 'گربه', 'لیمو', 'ماه', 'مرد', 'مادر', 'میوه',
            'ناز', 'نور', 'نیلوفر', 'واحد', 'هوا', 'یاس',
            // 4-letter words
            'آبشار', 'آسمانی', 'باغچه', 'بشنو', 'پرنده', 'تقویم', 'جادوگر',
            'چراغ', 'خاطره', 'درختان', 'دیوانه', 'زنگار', 'سبزه', 'ستاره',
            'شنیدن', 'صبر', 'عشق', 'غروب', 'قانونی', 'کوهستان', 'گنجشک',
            'لرزان', 'مزرعه', 'نقره', 'وسیله', 'هواشناسی', 'یاقوت'
        ]);

        // Letter sets for the game (Persian letters)
        const LETTER_SETS = [
            ['ا', 'ب', 'ت', 'ث', 'ج', 'ح', 'خ'],
            ['د', 'ذ', 'ر', 'ز', 'ژ', 'س', 'ش'],
            ['ص', 'ض', 'ط', 'ظ', 'ع', 'غ', 'ف'],
            ['ق', 'ک', 'گ', 'ل', 'م', 'ن', 'و'],
            ['ه', 'ی', 'ا', 'ب', 'ت', 'پ', 'چ']
        ];

        let currentLetters = [];
        let selectedLetters = [];
        let currentWord = '';
        let score = 0;
        let foundWords = [];
        let highScore = parseInt(localStorage.getItem('wordGameHighScore') || '0');

        function init() {
            document.getElementById('high-score').textContent = highScore;
            newGame();
        }

        function newGame() {
            score = 0;
            foundWords = [];
            selectedLetters = [];
            currentWord = '';

            // Pick random letters
            const randomSet = LETTER_SETS[Math.floor(Math.random() * LETTER_SETS.length)];
            currentLetters = [...randomSet].sort(() => Math.random() - 0.5);

            updateDisplay();
            renderLetters();
            hideGameOver();
        }

        function renderLetters() {
            const container = document.getElementById('letters-container');
            container.innerHTML = '';

            currentLetters.forEach((letter, index) => {
                const btn = document.createElement('button');
                btn.className = 'letter-btn';
                btn.textContent = letter;
                btn.onclick = () => selectLetter(index);
                if (selectedLetters.includes(index)) {
                    btn.classList.add('used');
                }
                container.appendChild(btn);
            });
        }

        function selectLetter(index) {
            if (selectedLetters.includes(index)) return;

            selectedLetters.push(index);
            currentWord += currentLetters[index];
            updateDisplay();
            renderLetters();
        }

        function clearWord() {
            selectedLetters = [];
            currentWord = '';
            updateDisplay();
            renderLetters();
        }

        function shuffleLetters() {
            currentLetters = [...currentLetters].sort(() => Math.random() - 0.5);
            clearWord();
            renderLetters();
        }

        function updateDisplay() {
            const display = document.getElementById('word-display');
            display.textContent = currentWord || '...';
            display.classList.toggle('has-word', currentWord.length > 0);

            document.getElementById('score').textContent = score;
            document.getElementById('word-count').textContent = foundWords.length;
            document.getElementById('found-count').textContent = foundWords.length;

            const wordsList = document.getElementById('words-list');
            wordsList.innerHTML = foundWords.map(w =>
                `<span class="word-tag">${w}</span>`
            ).join('');
        }

        function showMessage(text, type) {
            const container = document.getElementById('message-container');
            const msg = document.createElement('div');
            msg.className = `message ${type}`;
            msg.textContent = text;
            container.innerHTML = '';
            container.appendChild(msg);
            setTimeout(() => msg.remove(), 2000);
        }

        function submitWord() {
            if (currentWord.length < 2) {
                showMessage('حداقل ۲ حرف لازم است!', 'error');
                return;
            }

            if (foundWords.includes(currentWord)) {
                showMessage('این کلمه قبلاً پیدا شده!', 'error');
                clearWord();
                return;
            }

            if (VALID_WORDS.has(currentWord)) {
                const points = currentWord.length * 10;
                score += points;
                foundWords.push(currentWord);
                showMessage(`+${points} امتیاز!`, 'success');
                clearWord();
                updateDisplay();

                if (score > highScore) {
                    highScore = score;
                    localStorage.setItem('wordGameHighScore', highScore);
                    document.getElementById('high-score').textContent = highScore;
                }
            } else {
                showMessage('این کلمه معتبر نیست!', 'error');
                clearWord();
            }
        }

        function hideGameOver() {
            document.getElementById('game-over').classList.add('hidden');
        }

        // Keyboard support
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                submitWord();
            } else if (e.key === 'Backspace') {
                if (selectedLetters.length > 0) {
                    const lastIndex = selectedLetters.pop();
                    currentWord = currentWord.slice(0, -1);
                    updateDisplay();
                    renderLetters();
                }
            } else if (e.key === 'Escape') {
                clearWord();
            }
        });

        // Start game
        init();
    </script>
</body>
</html>
