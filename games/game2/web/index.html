<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>آمیرزا | hamidshariati.ir</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background: linear-gradient(135deg, #0f0a1e 0%, #1a1035 50%, #0f0a1e 100%);
            color: #e2e8f0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 15px;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }

        .header { text-align: center; margin-bottom: 10px; width: 100%; max-width: 400px; }
        .title { font-size: 2rem; font-weight: bold; background: linear-gradient(135deg, #f59e0b, #ef4444); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
        .level-info { font-size: 0.9rem; color: #94a3b8; margin-top: 5px; }

        .score-board { display: flex; justify-content: space-around; background: rgba(30, 41, 59, 0.8); border: 1px solid #334155; border-radius: 12px; padding: 10px; margin-bottom: 15px; width: 100%; max-width: 400px; }
        .score-item { text-align: center; }
        .score-label { font-size: 0.7rem; color: #94a3b8; }
        .score-value { font-size: 1.3rem; font-weight: bold; color: #facc15; }

        .target-words { background: rgba(30, 41, 59, 0.6); border: 1px solid #334155; border-radius: 12px; padding: 12px; margin-bottom: 15px; width: 100%; max-width: 400px; }
        .target-title { font-size: 0.75rem; color: #94a3b8; margin-bottom: 8px; }
        .target-list { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
        .target-word { 
            padding: 8px 14px; 
            background: #1e293b; 
            border: 1px solid #334155; 
            border-radius: 8px; 
            font-size: 1rem; 
            color: #cbd5e1; 
            font-family: monospace; 
            letter-spacing: 3px;
            min-width: 60px;
            text-align: center;
        }
        .target-word.found { 
            background: linear-gradient(135deg, #166534, #14532d); 
            border-color: #22c55e; 
            color: #4ade80;
            animation: popIn 0.3s ease;
        }
        .target-word.empty { 
            border-style: dashed;
            color: #475569;
        }

        @keyframes popIn {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .game-area {
            position: relative;
            width: 300px;
            height: 300px;
            margin-bottom: 15px;
        }

        .letter-circle {
            position: absolute;
            width: 100%;
            height: 100%;
        }

        .letter-node {
            position: absolute;
            width: 52px;
            height: 52px;
            border-radius: 50%;
            background: linear-gradient(135deg, #1e293b, #0f172a);
            border: 3px solid #475569;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.4rem;
            font-weight: bold;
            color: #e2e8f0;
            cursor: pointer;
            transition: all 0.15s;
            transform: translate(-50%, -50%);
        }

        .letter-node.selected {
            background: linear-gradient(135deg, #f59e0b, #ef4444);
            border-color: #fbbf24;
            color: white;
            transform: translate(-50%, -50%) scale(1.15);
            box-shadow: 0 0 20px rgba(245, 158, 11, 0.5);
        }

        .connection-line {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .current-word {
            min-height: 50px;
            background: rgba(30, 41, 59, 0.6);
            border: 2px dashed #475569;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            font-weight: bold;
            letter-spacing: 4px;
            margin-bottom: 15px;
            width: 100%;
            max-width: 400px;
            color: #facc15;
            transition: all 0.2s;
        }
        .current-word.has-content { border-color: #f59e0b; border-style: solid; }
        .current-word.valid { border-color: #22c55e; color: #4ade80; }
        .current-word.invalid { border-color: #ef4444; color: #f87171; }

        .message {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            padding: 12px 24px;
            border-radius: 12px;
            font-weight: bold;
            z-index: 100;
            animation: slideDown 0.3s ease;
        }

        .message.success { background: #166534; border: 1px solid #22c55e; color: #4ade80; }
        .message.error { background: #7f1d1d; border: 1px solid #ef4444; color: #f87171; }

        @keyframes slideDown {
            from { opacity: 0; transform: translateX(-50%) translateY(-20px); }
            to { opacity: 1; transform: translateX(-50%) translateY(0); }
        }

        .level-complete {
            position: fixed;
            inset: 0;
            background: rgba(15, 10, 30, 0.95);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }

        .level-complete-title { font-size: 2.5rem; font-weight: bold; color: #22c55e; margin-bottom: 20px; }
        .hidden { display: none !important; }

        .btn {
            padding: 12px 28px;
            border-radius: 10px;
            border: none;
            font-size: 1rem;
            cursor: pointer;
            font-family: inherit;
            transition: all 0.2s;
        }
        .btn-primary { background: linear-gradient(135deg, #22c55e, #16a34a); color: white; }
        .btn:hover { transform: translateY(-2px); }

        @media (max-width: 400px) {
            .game-area { width: 280px; height: 280px; }
            .letter-node { width: 46px; height: 46px; font-size: 1.2rem; }
            .title { font-size: 1.5rem; }
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="title">🎲 آمیرزا</div>
        <div class="level-info" id="level-info">مرحله ۱</div>
    </div>

    <div class="score-board">
        <div class="score-item"><div class="score-label">امتیاز</div><div class="score-value" id="score">0</div></div>
        <div class="score-item"><div class="score-label">کلمات</div><div class="score-value" id="words-found">0</div></div>
        <div class="score-item"><div class="score-label">باقی</div><div class="score-value" id="words-left">0</div></div>
    </div>

    <div class="target-words">
        <div class="target-title">کلمات مورد نیاز:</div>
        <div class="target-list" id="target-list"></div>
    </div>

    <div class="current-word" id="current-word">...</div>

    <div class="game-area" id="game-area">
        <svg class="connection-line" id="connection-line"></svg>
        <div class="letter-circle" id="letter-circle"></div>
    </div>

    <div class="level-complete hidden" id="level-complete">
        <div class="level-complete-title">مرحله تموم شد! 🎉</div>
        <div style="font-size:1.5rem; color:#facc15; margin-bottom:20px;" id="level-score"></div>
        <button class="btn btn-primary" onclick="nextLevel()" style="font-size:1.2rem; padding:15px 40px;">مرحله بعد</button>
    </div>

    <script>
        const WORDS = {
            2: ['آب', 'ام', 'ان', 'او', 'بر', 'بز', 'بت', 'پا', 'پر', 'تک', 'را', 'زا', 'سا', 'شی', 'کا', 'ما', 'نا', 'وا', 'ها', 'یا'],
            3: ['ابر', 'آتش', 'باغ', 'بالا', 'بازی', 'بچه', 'پدر', 'پسر', 'تازه', 'جادو', 'جوان', 'چمن', 'خاک', 'خانه', 'خوب', 'دست', 'زیبا', 'ساعت', 'سبز', 'سیب', 'شاد', 'صدا', 'غذا', 'کتاب', 'کودک', 'گل', 'ماه', 'مرد', 'مادر', 'میوه', 'نور', 'هوا'],
            4: ['آبشار', 'آسمان', 'باغچه', 'پرنده', 'چراغ', 'خاطره', 'درخت', 'ستاره', 'شنیدن', 'صبر', 'عشق', 'غروب', 'مزرعه', 'نقره', 'یاقوت'],
            5: ['آسمانی', 'بازیکن', 'پرواز', 'جادوگر', 'دریاچه', 'شبنم', 'شیرین', 'قانون', 'گربه']
        };

        const LEVELS = [
            { words: 3, lengths: [2, 2, 3] },
            { words: 4, lengths: [2, 3, 3, 2] },
            { words: 5, lengths: [3, 3, 2, 2, 3] },
            { words: 5, lengths: [3, 3, 3, 3, 2] },
            { words: 6, lengths: [3, 4, 3, 2, 3, 3] },
            { words: 7, lengths: [3, 4, 3, 3, 4, 2, 3] }
        ];

        let currentLevel = 0;
        let score = 0;
        let selectedLetters = [];
        let selectedIndices = [];
        let targetWords = [];
        let foundWords = [];
        let letters = [];
        let letterPositions = [];
        let isDragging = false;

        const gameArea = document.getElementById('game-area');
        const letterCircle = document.getElementById('letter-circle');
        const connectionLine = document.getElementById('connection-line');
        const currentWordEl = document.getElementById('current-word');

        function init() { loadLevel(); }

        function loadLevel() {
            const level = LEVELS[currentLevel % LEVELS.length];
            targetWords = [];
            foundWords = [];
            selectedLetters = [];
            selectedIndices = [];

            // Pick random words
            level.lengths.forEach(len => {
                const available = WORDS[len].filter(w => !targetWords.includes(w));
                if (available.length > 0) targetWords.push(available[Math.floor(Math.random() * available.length)]);
            });

            // Collect all letters from target words
            letters = [];
            targetWords.forEach(word => { for (let c of word) letters.push(c); });

            // Add extra letters
            const allChars = 'ابپتثجچحخدذرزژسشصضطظعغفقکگلمنوهی';
            const extraCount = Math.min(4, 12 - letters.length);
            for (let i = 0; i < extraCount; i++) letters.push(allChars[Math.floor(Math.random() * allChars.length)]);

            // Shuffle
            letters = letters.sort(() => Math.random() - 0.5).slice(0, 12);

            // Calculate circular positions
            calculatePositions();
            renderCircle();
            renderTargets();
            updateUI();
        }

        function calculatePositions() {
            const centerX = gameArea.offsetWidth / 2;
            const centerY = gameArea.offsetHeight / 2;
            const radius = Math.min(centerX, centerY) - 30;
            const count = letters.length;

            letterPositions = letters.map((_, i) => {
                const angle = (i / count) * Math.PI * 2 - Math.PI / 2;
                return {
                    x: centerX + radius * Math.cos(angle),
                    y: centerY + radius * Math.sin(angle)
                };
            });
        }

        function renderCircle() {
            letterCircle.innerHTML = letters.map((letter, i) => `
                <div class="letter-node" 
                     data-index="${i}"
                     style="left: ${letterPositions[i].x}px; top: ${letterPositions[i].y}px;">
                    ${letter}
                </div>
            `).join('');

            // Add touch/mouse events to letter nodes
            document.querySelectorAll('.letter-node').forEach(node => {
                node.addEventListener('mousedown', (e) => startDrag(e, parseInt(node.dataset.index)));
                node.addEventListener('touchstart', (e) => startDrag(e, parseInt(node.dataset.index)), { passive: false });
            });
        }

        function renderTargets() {
            document.getElementById('target-list').innerHTML = targetWords.map(word => {
                const isFound = foundWords.includes(word);
                const displayWord = isFound ? word : word.split('').map(() => 'ـ').join('');
                return `<div class="target-word ${isFound ? 'found' : 'empty'}">${displayWord}</div>`;
            }).join('');
        }

        function startDrag(e, index) {
            e.preventDefault();
            isDragging = true;
            selectedLetters = [letters[index]];
            selectedIndices = [index];
            updateSelection();
        }

        function onMove(e) {
            if (!isDragging) return;
            e.preventDefault();

            const touch = e.touches ? e.touches[0] : e;
            const rect = gameArea.getBoundingClientRect();
            const x = touch.clientX - rect.left;
            const y = touch.clientY - rect.top;

            // Check if over a letter node
            document.querySelectorAll('.letter-node').forEach(node => {
                const idx = parseInt(node.dataset.index);
                const pos = letterPositions[idx];
                const dist = Math.sqrt((x - pos.x) ** 2 + (y - pos.y) ** 2);

                if (dist < 35 && !selectedIndices.includes(idx)) {
                    selectedIndices.push(idx);
                    selectedLetters.push(letters[idx]);
                    updateSelection();
                }
            });
        }

        function endDrag() {
            if (!isDragging) return;
            isDragging = false;

            if (selectedLetters.length >= 2) {
                checkWord();
            }
            clearSelection();
        }

        function updateSelection() {
            // Update letter nodes
            document.querySelectorAll('.letter-node').forEach(node => {
                const idx = parseInt(node.dataset.index);
                node.classList.toggle('selected', selectedIndices.includes(idx));
            });

            // Update current word display
            const word = selectedLetters.join('');
            currentWordEl.textContent = word || '...';
            currentWordEl.classList.toggle('has-content', word.length > 0);

            // Draw connection line
            drawLine();
        }

        function drawLine() {
            if (selectedIndices.length < 2) {
                connectionLine.innerHTML = '';
                return;
            }

            const points = selectedIndices.map(idx => {
                const pos = letterPositions[idx];
                return `${pos.x},${pos.y}`;
            }).join(' ');

            connectionLine.innerHTML = `
                <polyline points="${points}" 
                    fill="none" 
                    stroke="rgba(245, 158, 11, 0.6)" 
                    stroke-width="4" 
                    stroke-linecap="round" 
                    stroke-linejoin="round"/>
            `;
        }

        function clearSelection() {
            selectedLetters = [];
            selectedIndices = [];
            document.querySelectorAll('.letter-node').forEach(n => n.classList.remove('selected'));
            currentWordEl.textContent = '...';
            currentWordEl.className = 'current-word';
            connectionLine.innerHTML = '';
        }

        function checkWord() {
            const word = selectedLetters.join('');

            if (foundWords.includes(word)) {
                showMessage('قبلاً پیدا شده!', 'error');
                return;
            }

            if (targetWords.includes(word)) {
                foundWords.push(word);
                score += word.length * 10;
                showMessage(`+${word.length * 10} امتیاز! ✓`, 'success');
                renderTargets();
                updateUI();

                if (foundWords.length === targetWords.length) {
                    setTimeout(() => {
                        document.getElementById('level-complete').classList.remove('hidden');
                        document.getElementById('level-score').textContent = `امتیاز: ${score}`;
                    }, 500);
                }
            } else {
                showMessage(`"${word}" نیست!`, 'error');
                currentWordEl.classList.add('invalid');
                setTimeout(() => currentWordEl.classList.remove('invalid'), 500);
            }
        }

        function showMessage(text, type) {
            const existing = document.querySelector('.message');
            if (existing) existing.remove();

            const msg = document.createElement('div');
            msg.className = `message ${type}`;
            msg.textContent = text;
            document.body.appendChild(msg);
            setTimeout(() => msg.remove(), 1500);
        }

        function nextLevel() {
            currentLevel++;
            document.getElementById('level-complete').classList.add('hidden');
            loadLevel();
        }

        function updateUI() {
            document.getElementById('score').textContent = score;
            document.getElementById('words-found').textContent = foundWords.length;
            document.getElementById('words-left').textContent = targetWords.length - foundWords.length;
            document.getElementById('level-info').textContent = `مرحله ${currentLevel + 1}`;
        }

        // Global event listeners
        document.addEventListener('mousemove', onMove);
        document.addEventListener('mouseup', endDrag);
        document.addEventListener('touchmove', onMove, { passive: false });
        document.addEventListener('touchend', endDrag);

        // Recalculate on resize
        window.addEventListener('resize', () => {
            calculatePositions();
            renderCircle();
        });

        init();
    </script>
</body>
</html>
