<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>وضعیت درخواست‌ها</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui,-apple-system,sans-serif;background:#0a0a0a;color:#e0e0e0;padding:20px;min-height:100vh}
h1{text-align:center;color:#00ff88;margin-bottom:30px;font-size:1.5rem}
.grid{display:grid;gap:16px;max-width:800px;margin:0 auto}
.card{background:#1a1a2e;border:1px solid #333;border-radius:12px;padding:16px;transition:all .2s}
.card:hover{border-color:#00ff88;box-shadow:0 0 15px rgba(0,255,136,.1)}
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.game{font-size:1.1rem;font-weight:600;color:#fff}
.time{font-size:.8rem;color:#888}
.badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:.75rem;font-weight:600}
.pending{background:#ff9800;color:#000}
.processing{background:#2196f3;color:#fff}
.done{background:#00ff88;color:#000}
.failed{background:#f44336;color:#fff}
.desc{color:#aaa;margin:8px 0;font-size:.9rem;line-height:1.6}
.meta{display:flex;gap:12px;font-size:.8rem;color:#666}
.meta span{display:flex;align-items:center;gap:4px}
.error{color:#f44336;margin-top:8px;padding:8px;background:rgba(244,67,54,.1);border-radius:6px;font-size:.8rem}
.empty{text-align:center;color:#666;padding:60px 0}
.refresh{display:block;margin:0 auto 20px;padding:8px 20px;background:#1a1a2e;border:1px solid #333;color:#00ff88;border-radius:8px;cursor:pointer;font-size:.9rem}
.refresh:hover{background:#252540}
</style>
</head>
<body>
<h1>وضعیت درخواست‌های ارتقاء بازی</h1>
<button class="refresh" onclick="load()">بروزرسانی</button>
<div class="grid" id="list"><div class="empty">در حال بارگذاری...</div></div>
<script>
const gameNames={snake:'مار نئون',game1:'بازی ۱',game2:'بازی ۲'};
const typeNames={feature:'ویژگی جدید',bugfix:'رفع باگ',enhancement:'بهبود',visual:'بصری',gameplay:'گیم‌پلی'};
const statusNames={pending:'در انتظار',processing:'در حال اجرا',done:'انجام شد',failed:'ناموفق'};
async function load(){
  try{
    const r=await fetch('api.php');
    const data=await r.json();
    const el=document.getElementById('list');
    if(!data.length){el.innerHTML='<div class="empty">درخواستی ثبت نشده</div>';return}
    el.innerHTML=data.map(q=>{
      const games=(q.games||[]).map(g=>gameNames[g]||g).join('، ');
      return `<div class="card">
        <div class="header">
          <span class="game">${games}</span>
          <span class="badge ${q.status}">${statusNames[q.status]||q.status}</span>
        </div>
        <div class="desc">${q.description||''}</div>
        <div class="meta">
          <span>نوع: ${typeNames[q.changeType]||q.changeType}</span>
          <span>اولویت: ${q.priority}</span>
          <span>${new Date(q.timestamp).toLocaleString('fa-IR')}</span>
        </div>
        ${q.error?`<div class="error">خطا: ${q.error}</div>`:''}
        ${q.started?`<div class="meta" style="margin-top:8px"><span>شروع: ${new Date(q.started).toLocaleString('fa-IR')}</span></div>`:''}
      </div>`}).join('')
  }catch(e){document.getElementById('list').innerHTML='<div class="empty">خطا در بارگذاری</div>'}
}
load();setInterval(load,10000);
</script>
</body>
</html>
