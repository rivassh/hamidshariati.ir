<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0f0f23">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>چت‌بات | hamidshariati.ir</title>
    <link rel="manifest" href="/manifest.json">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { 
            font-family: 'Segoe UI', Tahoma, sans-serif; 
            background: #0f0f23; 
            color: #e2e8f0; 
            height: 100%; 
            overflow: hidden;
            -webkit-tap-highlight-color: transparent;
        }
        
        .app { display: flex; height: 100%; }
        
        /* Sidebar */
        .sidebar {
            width: 280px;
            background: #0a0a1a;
            border-left: 1px solid #1e293b;
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            transition: transform 0.3s ease;
            z-index: 100;
        }
        
        .sidebar-header {
            padding: 16px;
            border-bottom: 1px solid #1e293b;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #0a0a1a;
        }
        
        .sidebar-title { font-size: 1rem; font-weight: 600; color: #94a3b8; }
        
        .new-chat-btn {
            width: 36px;
            height: 36px;
            border-radius: 8px;
            border: none;
            background: linear-gradient(135deg, #22d3ee, #a855f7);
            color: white;
            cursor: pointer;
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .sidebar-content {
            flex: 1;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }
        
        .section-title {
            font-size: 0.7rem;
            color: #64748b;
            text-transform: uppercase;
            padding: 12px 16px 6px;
            letter-spacing: 0.5px;
        }
        
        .items-list {
            display: flex;
            flex-direction: column;
            padding: 0 8px;
        }
        
        .item-link {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px;
            border-radius: 8px;
            text-decoration: none;
            color: #e2e8f0;
            transition: background 0.2s;
            border: none;
            background: none;
            cursor: pointer;
            font-family: inherit;
            font-size: 0.9rem;
            width: 100%;
            text-align: right;
        }
        
        .item-link:hover, .item-link:active { background: #1e293b; }
        
        .item-icon { font-size: 1.3rem; width: 28px; text-align: center; }
        .item-name { flex: 1; }
        
        .new-item-link {
            border: 1px dashed #475569;
            color: #94a3b8;
        }
        
        .new-item-link:hover, .new-item-link:active { border-color: #22d3ee; color: #22d3ee; }
        
        .bug-link {
            color: #f87171;
            border: 1px dashed #f8717140;
        }
        
        .bug-link:hover, .bug-link:active { background: #7f1d1d20; border-color: #f87171; }
        
        .chat-list {
            display: flex;
            flex-direction: column;
            padding: 0 8px 8px;
        }
        
        .chat-item {
            padding: 12px;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
            margin-bottom: 2px;
        }
        
        .chat-item:hover, .chat-item:active { background: #1e293b; }
        .chat-item.active { background: #164e63; }
        
        .chat-item-title {
            font-size: 0.85rem;
            color: #e2e8f0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        
        .chat-item-meta {
            font-size: 0.7rem;
            color: #64748b;
            margin-top: 4px;
            display: flex;
            gap: 6px;
            align-items: center;
        }
        
        .chat-item-delete {
            background: none;
            border: none;
            color: #64748b;
            cursor: pointer;
            font-size: 0.75rem;
            padding: 2px;
        }
        
        .chat-item-delete:hover { color: #ef4444; }
        
        .sidebar-footer {
            padding: 12px 16px;
            border-top: 1px solid #1e293b;
            font-size: 0.7rem;
            color: #475569;
            text-align: center;
        }
        
        /* Main chat */
        .chat-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
            background: #0f0f23;
        }
        
        .chat-header {
            padding: 12px 16px;
            background: linear-gradient(135deg, #1e293b, #0f172a);
            border-bottom: 1px solid #334155;
            display: flex;
            align-items: center;
            gap: 12px;
            flex-shrink: 0;
        }
        
        .menu-btn {
            width: 40px;
            height: 40px;
            border-radius: 8px;
            border: none;
            background: transparent;
            color: #94a3b8;
            cursor: pointer;
            font-size: 1.4rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .chat-header-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, #22d3ee, #a855f7);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            font-weight: 600;
            color: white;
            flex-shrink: 0;
        }
        
        .chat-header-info { flex: 1; min-width: 0; }
        .chat-header-name { font-weight: 600; font-size: 0.95rem; color: #f1f5f9; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .chat-header-status { font-size: 0.75rem; color: #22d3ee; }
        
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            -webkit-overflow-scrolling: touch;
        }
        
        .message {
            max-width: 85%;
            padding: 10px 14px;
            border-radius: 14px;
            line-height: 1.5;
            word-wrap: break-word;
            animation: fadeIn 0.2s ease;
            font-size: 0.9rem;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .message-user {
            align-self: flex-end;
            background: linear-gradient(135deg, #22d3ee, #0ea5e9);
            color: white;
            border-bottom-right-radius: 4px;
        }
        
        .message-assistant {
            align-self: flex-start;
            background: #1e293b;
            color: #e2e8f0;
            border-bottom-left-radius: 4px;
            border: 1px solid #334155;
        }
        
        .message-system {
            align-self: center;
            background: transparent;
            color: #64748b;
            font-size: 0.8rem;
            padding: 6px 12px;
        }
        
        .typing-indicator {
            padding: 10px 14px;
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 14px;
            width: fit-content;
            align-self: flex-start;
            font-size: 0.85rem;
            color: #94a3b8;
        }
        
        .chat-input-area {
            padding: 10px 12px;
            background: #1e293b;
            border-top: 1px solid #334155;
            flex-shrink: 0;
        }
        
        .quick-actions {
            display: flex;
            gap: 6px;
            margin-bottom: 8px;
            overflow-x: auto;
            padding-bottom: 4px;
        }
        
        .quick-btn {
            padding: 6px 10px;
            background: #334155;
            border: 1px solid #475569;
            border-radius: 16px;
            color: #cbd5e1;
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
            white-space: nowrap;
            flex-shrink: 0;
        }
        
        .quick-btn:hover, .quick-btn:active {
            background: #475569;
            border-color: #22d3ee;
            color: #22d3ee;
        }
        
        .chat-input-row {
            display: flex;
            gap: 8px;
            align-items: flex-end;
        }
        
        .input-wrapper {
            flex: 1;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 22px;
            display: flex;
            align-items: flex-end;
            padding: 4px 8px;
            min-height: 44px;
        }
        
        .chat-input {
            flex: 1;
            padding: 8px;
            background: transparent;
            border: none;
            color: #e2e8f0;
            font-size: 0.95rem;
            font-family: inherit;
            resize: none;
            max-height: 80px;
            min-height: 28px;
            outline: none;
            line-height: 1.4;
        }
        
        .chat-input::placeholder { color: #64748b; }
        
        .input-actions {
            display: flex;
            gap: 2px;
            flex-shrink: 0;
        }
        
        .input-btn {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            border: none;
            background: transparent;
            color: #64748b;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            font-size: 1rem;
        }
        
        .input-btn:hover, .input-btn:active { background: #334155; color: #22d3ee; }
        .input-btn.recording { background: #dc2626; color: white; }
        
        .send-btn {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            border: none;
            background: linear-gradient(135deg, #22d3ee, #a855f7);
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            flex-shrink: 0;
        }
        
        .send-btn:hover { transform: scale(1.05); }
        .send-btn:disabled { background: #475569; cursor: not-allowed; transform: none; }
        .send-btn svg { width: 18px; height: 18px; }
        
        /* Mobile */
        @media (max-width: 768px) {
            .sidebar {
                position: fixed;
                top: 0;
                right: 0;
                bottom: 0;
                width: 85%;
                max-width: 320px;
                transform: translateX(100%);
            }
            .sidebar.open { transform: translateX(0); }
            
            .sidebar-overlay {
                position: fixed;
                inset: 0;
                background: rgba(0,0,0,0.6);
                z-index: 99;
                opacity: 0;
                pointer-events: none;
                transition: opacity 0.3s;
            }
            .sidebar-overlay.open { opacity: 1; pointer-events: auto; }
            
            .menu-btn { display: flex; }
            .chat-messages { padding: 12px; }
            .message { max-width: 90%; }
            .chat-input-area { padding: 8px; }
        }
        
        @supports (padding: env(safe-area-inset-bottom)) {
            .chat-input-area { padding-bottom: calc(10px + env(safe-area-inset-bottom)); }
        }
    </style>
</head>
<body>
    <div class="app">
        <div class="sidebar-overlay" id="sidebar-overlay" onclick="toggleSidebar(false)"></div>
        
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <span class="sidebar-title" id="sidebar-title">منو</span>
                <button class="new-chat-btn" onclick="newChat()" title="چت جدید">+</button>
            </div>
            
            <div class="sidebar-content">
                <div class="section-title" id="items-section-title">موضوعات</div>
                <div class="items-list" id="items-list"></div>
                
                <div class="section-title">تاریخچه چت</div>
                <div class="chat-list" id="chat-list"></div>
            </div>
            
            <div class="sidebar-footer">
                <button class="item-link bug-link" onclick="requestBugReport()" style="width:100%">
                    <span class="item-icon">🐛</span>
                    <span class="item-name">گزارش خطا</span>
                </button>
                <div style="margin-top:8px" id="footer-text">hamidshariati.ir © 2026</div>
            </div>
        </aside>

        <div class="chat-container">
            <div class="chat-header">
                <button class="menu-btn" onclick="toggleSidebar(true)">☰</button>
                <div class="chat-header-avatar" id="bot-avatar">د</div>
                <div class="chat-header-info">
                    <div class="chat-header-name" id="chat-title">چت جدید</div>
                    <div class="chat-header-status" id="status-text">آنلاین</div>
                </div>
            </div>
            
            <div class="chat-messages" id="messages">
                <div class="message message-system" id="welcome-msg">درخواستت رو بگو، دانا اجرا می‌کنه 🎮</div>
            </div>
            
            <div class="chat-input-area">
                <div class="quick-actions" id="quick-actions"></div>
                
                <div class="chat-input-row">
                    <div class="input-wrapper">
                        <textarea class="chat-input" id="messageInput" placeholder="درخواستت رو بنویس یا بگو..." rows="1"></textarea>
                        <div class="input-actions">
                            <button class="input-btn" id="voice-btn" title="تبدیل صدا به متن">🎤</button>
                        </div>
                    </div>
                    <button class="send-btn" id="sendBtn" disabled>
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <line x1="22" y1="2" x2="11" y2="13"></line>
                            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                        </svg>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ========== Config (loaded from server) ==========
        let CONFIG = {
            botName: 'دانا',
            topic: 'games',
            topicTitle: 'چت‌بات ارتقاء بازی',
            topicIcon: '🎮',
            sidebarItems: [
                { icon: '🐍', name: 'مار نئون', url: '/game-platform/' },
                { icon: '🎲', name: 'بازی کلمات', url: '/games/game2/web/' },
                { icon: '🎯', name: 'بازی ۱', url: '/games/game1/builds/v1.0/' }
            ],
            quickActions: ['+ قدرت ویژه', '+ صدا', '+ تم جدید', 'رفع باگ', '📱 موبایل']
        };

        // ========== DOM ==========
        const messagesEl = document.getElementById('messages');
        const messageInput = document.getElementById('messageInput');
        const sendBtn = document.getElementById('sendBtn');
        const voiceBtn = document.getElementById('voice-btn');
        const statusText = document.getElementById('status-text');
        const chatTitle = document.getElementById('chat-title');
        const chatList = document.getElementById('chat-list');
        const itemsList = document.getElementById('items-list');
        const sidebar = document.getElementById('sidebar');
        const sidebarOverlay = document.getElementById('sidebar-overlay');
        const welcomeMsg = document.getElementById('welcome-msg');
        const quickActionsEl = document.getElementById('quick-actions');
        const sidebarTitle = document.getElementById('sidebar-title');
        const itemsSectionTitle = document.getElementById('items-section-title');
        const botAvatar = document.getElementById('bot-avatar');
        const footerText = document.getElementById('footer-text');
        
        const API_URL = window.location.origin;
        const CHAT_KEY = 'webapp_chats';
        const BUG_KEY = 'webapp_bugs';
        
        let currentChatId = null;
        let currentMode = 'chat';
        let messages = [];
        let isLoading = false;
        let recognition = null;
        let isRecording = false;

        // ========== Config Load ==========
        async function loadConfig() {
            try {
                const res = await fetch(`${API_URL}/api/config`);
                const data = await res.json();
                CONFIG = { ...CONFIG, ...data };
            } catch (e) {}
            
            document.title = `${CONFIG.topicTitle} | hamidshariati.ir`;
            sidebarTitle.textContent = CONFIG.topicTitle;
            itemsSectionTitle.textContent = CONFIG.topic;
            botAvatar.textContent = CONFIG.botName[0];
            welcomeMsg.textContent = `درخواستت رو بگو، ${CONFIG.botName} اجرا می‌کنه ${CONFIG.topicIcon}`;
            
            renderSidebarItems();
            renderQuickActions();
        }

        function renderSidebarItems() {
            itemsList.innerHTML = CONFIG.sidebarItems.map(item => `
                <a href="${item.url}" class="item-link" target="_blank">
                    <span class="item-icon">${item.icon}</span>
                    <span class="item-name">${item.name}</span>
                </a>
            `).join('') + `
                <button class="item-link new-item-link" onclick="requestNewItem()">
                    <span class="item-icon">✨</span>
                    <span class="item-name">جدید</span>
                </button>
            `;
        }

        function renderQuickActions() {
            quickActionsEl.innerHTML = CONFIG.quickActions.map(action => 
                `<button class="quick-btn" data-msg="${action}">${action}</button>`
            ).join('');
            
            document.querySelectorAll('.quick-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    messageInput.value = btn.dataset.msg;
                    messageInput.dispatchEvent(new Event('input'));
                    messageInput.focus();
                });
            });
        }

        // ========== Storage ==========
        function getChats() { try { return JSON.parse(localStorage.getItem(CHAT_KEY) || '[]'); } catch(e) { return []; } }
        function saveChats(c) { localStorage.setItem(CHAT_KEY, JSON.stringify(c)); }
        function getBugs() { try { return JSON.parse(localStorage.getItem(BUG_KEY) || '[]'); } catch(e) { return []; } }
        function saveBugs(b) { localStorage.setItem(BUG_KEY, JSON.stringify(b)); }

        // ========== Chat Ops ==========
        function saveCurrentChat() {
            if (!currentChatId || messages.length === 0) return;
            const chats = getChats();
            const firstMsg = messages.find(m => m.role === 'user');
            const title = firstMsg ? firstMsg.content.slice(0, 40) : 'چت جدید';
            
            const data = { id: currentChatId, title, messages: [...messages], updated: Date.now() };
            const idx = chats.findIndex(c => c.id === currentChatId);
            if (idx >= 0) Object.assign(chats[idx], data);
            else chats.unshift(data);
            if (chats.length > 50) chats.length = 50;
            saveChats(chats);
            renderChatList();
        }

        function loadChat(chatId) {
            const chat = getChats().find(c => c.id === chatId);
            if (!chat) return;
            currentChatId = chat.id;
            currentMode = 'chat';
            messages = [...chat.messages];
            chatTitle.textContent = chat.title;
            renderMessages();
            renderChatList();
            toggleSidebar(false);
        }

        function newChat() {
            if (messages.length > 0 && currentMode === 'chat') saveCurrentChat();
            currentChatId = 'chat_' + Date.now();
            currentMode = 'chat';
            messages = [];
            chatTitle.textContent = 'چت جدید';
            messagesEl.innerHTML = `<div class="message message-system">${welcomeMsg.textContent}</div>`;
            renderChatList();
            toggleSidebar(false);
        }

        function deleteChat(id, e) {
            e.stopPropagation();
            saveChats(getChats().filter(c => c.id !== id));
            if (currentChatId === id) newChat(); else renderChatList();
        }

        function requestNewItem() {
            if (messages.length > 0 && currentMode === 'chat') saveCurrentChat();
            currentChatId = 'new_' + Date.now();
            currentMode = 'chat';
            messages = [];
            chatTitle.textContent = '✨ جدید';
            messagesEl.innerHTML = `
                <div class="message message-system">چه چیز جدیدی می‌خوای؟</div>
                <div class="message message-system">توضیح بده تا بسازمش.</div>
            `;
            renderChatList();
            toggleSidebar(false);
            messageInput.focus();
        }

        // ========== Bug Report ==========
        function requestBugReport() {
            if (messages.length > 0 && currentMode === 'chat') saveCurrentChat();
            currentChatId = 'bug_' + Date.now();
            currentMode = 'bug';
            messages = [];
            chatTitle.textContent = '🐛 گزارش خطا';
            messagesEl.innerHTML = `<div class="message message-system">چه مشکلی هست؟ توضیح بده.</div>`;
            renderChatList();
            toggleSidebar(false);
            messageInput.focus();
        }

        function requestBugFix() {
            const bugs = getBugs().filter(b => b.status === 'open');
            if (bugs.length === 0) {
                addMessage('assistant', 'گزارش خطاie‌ای ثبت نشده.');
                return;
            }
            let text = 'گزارش‌های خطا:\n\n';
            bugs.forEach((b, i) => { text += `${i+1}. ${b.description.slice(0, 50)}...\n`; });
            addMessage('assistant', text);
        }

        // ========== Messages ==========
        function renderMessages() {
            messagesEl.innerHTML = messages.length === 0 
                ? `<div class="message message-system">${welcomeMsg.textContent}</div>`
                : '';
            messages.forEach(msg => {
                const el = document.createElement('div');
                el.className = `message message-${msg.role}`;
                el.textContent = msg.content;
                messagesEl.appendChild(el);
            });
            messagesEl.scrollTop = messagesEl.scrollHeight;
        }

        function addMessage(role, content) {
            messages.push({ role, content, timestamp: Date.now() });
            if (currentMode === 'bug' && role === 'user') {
                const bugs = getBugs();
                bugs.unshift({ id: currentChatId, description: content, messages: [...messages], created: Date.now(), status: 'open' });
                if (bugs.length > 100) bugs.length = 100;
                saveBugs(bugs);
            } else if (currentMode === 'chat') {
                saveCurrentChat();
            }
            
            const el = document.createElement('div');
            el.className = `message message-${role}`;
            el.textContent = content;
            messagesEl.appendChild(el);
            messagesEl.scrollTop = messagesEl.scrollHeight;
        }

        function showTyping(msg) {
            isLoading = true;
            sendBtn.disabled = true;
            statusText.textContent = msg || 'در حال پردازش...';
            let el = document.getElementById('typing');
            if (!el) {
                el = document.createElement('div');
                el.className = 'typing-indicator';
                el.id = 'typing';
                messagesEl.appendChild(el);
            }
            el.textContent = msg || 'در حال ارسال...';
            messagesEl.scrollTop = messagesEl.scrollHeight;
        }

        function hideTyping() {
            isLoading = false;
            sendBtn.disabled = !messageInput.value.trim();
            statusText.textContent = 'آنلاین';
            document.getElementById('typing')?.remove();
        }

        // ========== Send ==========
        async function sendMessage() {
            const text = messageInput.value.trim();
            if (!text || isLoading) return;
            
            messageInput.value = '';
            messageInput.style.height = 'auto';
            sendBtn.disabled = true;
            addMessage('user', text);
            
            if (currentMode === 'bug') {
                showTyping('در حال بررسی...');
                setTimeout(() => {
                    hideTyping();
                    addMessage('assistant', `گزارش ثبت شد: "${text.slice(0, 50)}..."\n\nوقتی خواستی اصلاح کنی، بگو "اصلاح خطا".`);
                }, 1000);
                return;
            }
            
            showTyping('در حال ارسال...');
            try {
                const res = await fetch(`${API_URL}/api/chat`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: text }),
                });
                const data = await res.json();
                if (!data.jobId) { hideTyping(); addMessage('assistant', 'خطا در ارسال.'); return; }
                showTyping('در صف پردازش...');
                await pollForResponse(data.jobId);
            } catch (err) {
                hideTyping();
                addMessage('assistant', 'خطا: ' + err.message);
            }
        }

        async function pollForResponse(jobId, attempt = 0) {
            if (attempt >= 60) { hideTyping(); addMessage('assistant', 'پاسخی دریافت نشد.'); return; }
            await new Promise(r => setTimeout(r, 1500));
            try {
                const res = await fetch(`${API_URL}/api/status/${jobId}`);
                const data = await res.json();
                if (data.status === 'done') { hideTyping(); addMessage('assistant', data.response); return; }
                if (data.status === 'error' || data.status === 'timeout') { hideTyping(); addMessage('assistant', data.response || 'خطا.'); return; }
                await pollForResponse(jobId, attempt + 1);
            } catch (e) { await pollForResponse(jobId, attempt + 1); }
        }

        // ========== Sidebar ==========
        function toggleSidebar(open) {
            const isOpen = open !== undefined ? open : !sidebar.classList.contains('open');
            sidebar.classList.toggle('open', isOpen);
            sidebarOverlay.classList.toggle('open', isOpen);
        }

        function renderChatList() {
            const chats = getChats();
            chatList.innerHTML = chats.map(c => `
                <div class="chat-item ${c.id === currentChatId ? 'active' : ''}" onclick="loadChat('${c.id}')">
                    <div class="chat-item-title">${esc(c.title)}</div>
                    <div class="chat-item-meta">
                        <span>${timeAgo(c.updated)}</span>
                        <button class="chat-item-delete" onclick="deleteChat('${c.id}', event)">🗑️</button>
                    </div>
                </div>
            `).join('');
        }

        function esc(t) { const d = document.createElement('div'); d.textContent = t; return d.innerHTML; }
        function timeAgo(ts) {
            if (!ts) return '';
            const diff = Date.now() - ts;
            if (diff < 60000) return 'الان';
            if (diff < 3600000) return Math.floor(diff/60000) + ' دقیقه';
            if (diff < 86400000) return Math.floor(diff/3600000) + ' ساعت';
            return new Date(ts).toLocaleDateString('fa-IR');
        }

        // ========== Events ==========
        sendBtn.addEventListener('click', sendMessage);
        messageInput.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); } });
        messageInput.addEventListener('input', () => {
            messageInput.style.height = 'auto';
            messageInput.style.height = Math.min(messageInput.scrollHeight, 80) + 'px';
            sendBtn.disabled = !messageInput.value.trim();
        });

        // ========== Voice ==========
        function setupVoice() {
            const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SR) { voiceBtn.style.display = 'none'; return; }
            recognition = new SR();
            recognition.continuous = false;
            recognition.interimResults = true;
            recognition.lang = 'fa-IR';
            recognition.onstart = () => { isRecording = true; voiceBtn.classList.add('recording'); };
            recognition.onresult = (e) => {
                let t = '';
                for (let i = e.resultIndex; i < e.results.length; i++) t += e.results[i][0].transcript;
                messageInput.value = t;
                messageInput.dispatchEvent(new Event('input'));
            };
            recognition.onend = () => { isRecording = false; voiceBtn.classList.remove('recording'); };
            recognition.onerror = () => { isRecording = false; voiceBtn.classList.remove('recording'); };
            voiceBtn.addEventListener('click', () => { isRecording ? recognition.stop() : recognition.start(); });
        }

        // ========== Init ==========
        async function init() {
            await loadConfig();
            setupVoice();
            renderChatList();
            messageInput.focus();
        }
        init();

        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/sw.js').catch(() => {});
        }
    </script>
</body>
</html>
