services:
  web:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${GAME_PLATFORM_PORT:-18034}:80"
    volumes:
      - ./index.html:/usr/share/nginx/html/index.html:ro
      - ./game.js:/usr/share/nginx/html/game.js:ro
      - ./style.css:/usr/share/nginx/html/style.css:ro
